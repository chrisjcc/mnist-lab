raw_dir: data/raw
processed_dir: data/processed
download: true
val_fraction: ${param:data.val_fraction, 0.1}
mean: ${param:data.mean, 0.1307}
std: ${param:data.std, 0.3081}
batch_size: ${param:data.batch_size, 128}
num_workers: 0
pin_memory: false
seed: ${param:data.seed, 42}
allow_synthetic_fallback: true
num_synthetic_train: 600
num_synthetic_test: 100

augmentation:
  enabled: ${param:data.augmentation.enabled, false}
  degrees: ${param:data.augmentation.degrees, 12.0}
  translate: ${param:data.augmentation.translate, [0.12, 0.12]}
  scale: ${param:data.augmentation.scale, [0.85, 1.15]}
